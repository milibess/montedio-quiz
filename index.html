<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>モンテディオ山形クイズ</title>
<style>
  :root {
    --blue: #1560bd;
    --blue-dark: #0d4a94;
    --orange: #f39800;
    --bg: #f2f5f9;
    --card: #ffffff;
    --text: #1f2933;
    --muted: #5b6b7c;
    --correct-bg: #e3f5e8;
    --correct-fg: #1b7a3d;
    --wrong-bg: #fde8e8;
    --wrong-fg: #b4232c;
    --border: #d7dee7;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
      "Hiragino Sans", "Noto Sans JP", Meiryo, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.7;
    -webkit-text-size-adjust: 100%;
  }

  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: 16px 16px 48px;
    min-height: 100vh;
  }

  header {
    text-align: center;
    padding: 20px 12px 12px;
  }

  header h1 {
    font-size: 1.25rem;
    margin: 0 0 6px;
    color: var(--blue-dark);
  }

  .sample-note {
    background: #fff4e0;
    border: 1px solid var(--orange);
    color: #8a5a00;
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 0.8rem;
    margin: 12px 0 20px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px 18px;
    box-shadow: 0 4px 16px rgba(21, 96, 189, 0.06);
  }

  .progress {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.8rem;
    color: var(--muted);
    margin-bottom: 6px;
  }

  .bar {
    height: 6px;
    background: #e7edf4;
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 18px;
  }

  .bar > span {
    display: block;
    height: 100%;
    background: var(--blue);
    transition: width 0.3s ease;
  }

  .question {
    font-size: 1.05rem;
    font-weight: 700;
    margin: 0 0 16px;
  }

  .choices {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .choice {
    display: block;
    width: 100%;
    text-align: left;
    padding: 14px 16px;
    font-size: 0.98rem;
    font-family: inherit;
    color: var(--text);
    background: #fff;
    border: 2px solid var(--border);
    border-radius: 12px;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
    -webkit-tap-highlight-color: transparent;
  }

  .choice:hover:not(:disabled) { border-color: var(--blue); }
  .choice:disabled { cursor: default; }

  .choice.is-correct {
    background: var(--correct-bg);
    border-color: var(--correct-fg);
    color: var(--correct-fg);
    font-weight: 700;
  }

  .choice.is-wrong {
    background: var(--wrong-bg);
    border-color: var(--wrong-fg);
    color: var(--wrong-fg);
    font-weight: 700;
  }

  .feedback {
    margin-top: 16px;
    padding: 14px 16px;
    border-radius: 12px;
    font-size: 0.92rem;
  }

  .feedback.correct { background: var(--correct-bg); color: var(--correct-fg); }
  .feedback.wrong { background: var(--wrong-bg); color: var(--wrong-fg); }

  .feedback .verdict { font-weight: 700; display: block; margin-bottom: 4px; }
  .feedback .explain { color: var(--text); }

  .btn {
    display: block;
    width: 100%;
    margin-top: 18px;
    padding: 15px 18px;
    font-size: 1rem;
    font-family: inherit;
    font-weight: 700;
    color: #fff;
    background: var(--blue);
    border: none;
    border-radius: 12px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .btn:hover { background: var(--blue-dark); }
  .btn.secondary { background: var(--orange); }
  .btn.secondary:hover { background: #d98600; }

  .result { text-align: center; }
  .result h2 { color: var(--blue-dark); margin: 4px 0 12px; }

  .score {
    font-size: 2.4rem;
    font-weight: 800;
    color: var(--blue);
    margin: 8px 0;
  }

  .score small { font-size: 1rem; color: var(--muted); font-weight: 600; }

  .result-msg { color: var(--muted); font-size: 0.95rem; margin-bottom: 4px; }

  .hidden { display: none; }

  footer {
    text-align: center;
    font-size: 0.72rem;
    color: var(--muted);
    margin-top: 22px;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>モンテディオ山形クイズ</h1>
    <div class="sample-note">
      出典：<strong>モンテディオ山形 オフィシャルサイト</strong>「クラブ概要／沿革」
      （montedioyamagata.jp/club/）。設問・選択肢・解説は同ページに記載の内容のみに
      基づいています。それ以外の情報（選手名・試合記録など）は使用していません。
    </div>
  </header>

  <main id="quiz" class="card">
    <div class="progress">
      <span id="qCount">第 1 問 / 全 5 問</span>
      <span id="scoreNow">正解 0</span>
    </div>
    <div class="bar"><span id="barFill" style="width:0%"></span></div>

    <p class="question" id="questionText">読み込み中…</p>
    <div class="choices" id="choices"></div>

    <div class="feedback hidden" id="feedback">
      <span class="verdict" id="verdict"></span>
      <span class="explain" id="explain"></span>
    </div>

    <button class="btn hidden" id="nextBtn">次の問題へ</button>
  </main>

  <section id="result" class="card result hidden">
    <h2>結果発表</h2>
    <p class="result-msg">5問中の正解数</p>
    <div class="score"><span id="finalScore">0</span> <small>/ 5</small></div>
    <p class="result-msg" id="resultComment"></p>
    <button class="btn secondary" id="retryBtn">もう一度挑戦する</button>
  </section>

  <footer>出典：モンテディオ山形 オフィシャルサイト（montedioyamagata.jp）/ HTML・CSS・JavaScript のみで動作</footer>
</div>

<script>
  // ===== 問題データ =====
  // 出典：モンテディオ山形 オフィシャルサイト「クラブ概要／沿革」
  // https://www.montedioyamagata.jp/club/
  // 上記ページに明記されている内容のみを使用しています。
  const QUESTIONS = [
    {
      q: "クラブ名「モンテディオ」は、どの言語のどんな言葉を組み合わせた造語？",
      choices: [
        "イタリア語の「MONTE（山）」と「DIO（神）」",
        "スペイン語の「MONTE（山）」と「RIO（川）」",
        "ラテン語の「MONS（山）」と「VIA（道）」",
        "ポルトガル語の「MONTE（丘）」と「SOL（太陽）」"
      ],
      answer: 0,
      explain: "公式サイトによると、イタリア語の「MONTE（山）」と「DIO（神）」を組み合わせた造語で「山の神」を意味し、拠点である出羽三山（月山・湯殿山・羽黒山）と頂点を目指すチームを表しています。"
    },
    {
      q: "公式サイトの「クラブ概要」に記載されているクラブカラーは？",
      choices: ["ブルー", "レッド", "グリーン", "オレンジ"],
      answer: 0,
      explain: "公式サイトの「クラブ概要」では、クラブカラーは「ブルー」と記載されています。"
    },
    {
      q: "チーム名が「モンテディオ山形」と改称されたのは何年？（公式サイトの沿革より）",
      choices: ["1996年", "1984年", "1999年", "2014年"],
      answer: 0,
      explain: "公式サイトの沿革によれば、1984年にNEC山形のサッカー同好会として発足し、1996年にチーム名を「モンテディオ山形」と改称、1999年にJリーグへ入会しています。"
    },
    {
      q: "公式サイトで、ホームタウンの中心として挙げられている山形県内の3市は？",
      choices: [
        "山形市・天童市・鶴岡市",
        "山形市・米沢市・酒田市",
        "天童市・寒河江市・上山市",
        "山形市・新庄市・長井市"
      ],
      answer: 0,
      explain: "公式サイトの「活動区域／ホームタウン」は「山形県／山形市、天童市、鶴岡市を中心とする全県」と記載されています。"
    },
    {
      q: "公式サイトで紹介されている2体のマスコットの名前は？",
      choices: [
        "ディーオ と モンテス",
        "モンタ と ディーゴ",
        "ディオン と モンテ",
        "ユキマル と サンダー"
      ],
      answer: 0,
      explain: "公式サイトで紹介されているマスコットは「ディーオ」と「モンテス」の2体です。"
    }
  ];

  const el = (id) => document.getElementById(id);
  const quizBox = el("quiz");
  const resultBox = el("result");

  let current = 0;
  let score = 0;
  let answered = false;

  function renderQuestion() {
    answered = false;
    const item = QUESTIONS[current];

    el("qCount").textContent = `第 ${current + 1} 問 / 全 ${QUESTIONS.length} 問`;
    el("scoreNow").textContent = `正解 ${score}`;
    el("barFill").style.width = `${(current / QUESTIONS.length) * 100}%`;

    el("questionText").textContent = item.q;

    const choicesBox = el("choices");
    choicesBox.innerHTML = "";
    item.choices.forEach((text, idx) => {
      const btn = document.createElement("button");
      btn.className = "choice";
      btn.type = "button";
      btn.textContent = text;
      btn.addEventListener("click", () => handleAnswer(idx));
      choicesBox.appendChild(btn);
    });

    el("feedback").className = "feedback hidden";
    el("nextBtn").className = "btn hidden";
    el("nextBtn").textContent =
      current === QUESTIONS.length - 1 ? "結果を見る" : "次の問題へ";
  }

  function handleAnswer(choiceIdx) {
    if (answered) return;
    answered = true;

    const item = QUESTIONS[current];
    const isCorrect = choiceIdx === item.answer;
    if (isCorrect) score++;

    const buttons = el("choices").querySelectorAll(".choice");
    buttons.forEach((btn, idx) => {
      btn.disabled = true;
      if (idx === item.answer) btn.classList.add("is-correct");
      else if (idx === choiceIdx) btn.classList.add("is-wrong");
    });

    const fb = el("feedback");
    fb.className = "feedback " + (isCorrect ? "correct" : "wrong");
    el("verdict").textContent = isCorrect ? "○ 正解！" : "× 不正解";
    el("explain").textContent = item.explain;

    el("scoreNow").textContent = `正解 ${score}`;
    el("nextBtn").className = "btn";
  }

  function goNext() {
    current++;
    if (current < QUESTIONS.length) {
      renderQuestion();
    } else {
      showResult();
    }
  }

  function showResult() {
    quizBox.classList.add("hidden");
    resultBox.classList.remove("hidden");
    el("finalScore").textContent = score;

    let msg;
    if (score === QUESTIONS.length) msg = "全問正解！すばらしい！";
    else if (score >= 3) msg = "いい調子です！";
    else msg = "もう一度挑戦してみましょう。";
    el("resultComment").textContent = msg;
  }

  function restart() {
    current = 0;
    score = 0;
    resultBox.classList.add("hidden");
    quizBox.classList.remove("hidden");
    renderQuestion();
  }

  el("nextBtn").addEventListener("click", goNext);
  el("retryBtn").addEventListener("click", restart);

  renderQuestion();
</script>
</body>
</html>
